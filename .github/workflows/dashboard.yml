name: Dashboard

# Scans the demo projects and publishes the HTML dashboard.
# The report is always attached to the run as an artifact. It is also deployed to
# GitHub Pages once Pages is enabled (Settings > Pages > Source: GitHub Actions).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: new vulnerabilities appear without any code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          paths: examples
          title: "depscan demo: risky dependencies"
          output-dir: site
      - uses: actions/upload-artifact@v4
        with:
          name: depscan-report
          path: site
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages (source: GitHub Actions) is not enabled; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site

  deploy:
    needs: scan
    if: needs.scan.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
